server:
  port: 8080

spring:
  application:
    name: orchestrator-service
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
  config:
      import: "optional:file:.env[.properties]"

  # Enable virtual threads to process long AI streaming responses efficiently
  threads:
    virtual:
      enabled: true

  # Datastore Configuration — all secrets externalized via env vars
  datasource:
    # Falls back to local host (port 5433) and matches credentials in your .env
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:modernizer}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:modernizer}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:modernizer_postgres_pass}}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false # Set to false in production for optimal performance
    hibernate:
      ddl-auto: validate # Use 'validate' or 'none' since Flyway migrations are active
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Synced Redis with local mapped host (port 6380) and auth configs
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6380}}
      password: ${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}

  # Synced RabbitMQ with credentials established in your .env
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:modernizer_rabbit}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:super_secret_rabbit_pass}}

  # ── Spring AI 2.x / Google GenAI configuration ──
  ai:
    google:
      genai:
        project-id: ${GCP_PROJECT:dummy}
        location: us-central1
        chat:
          model: gemini-2.5-pro
          temperature: 0.1
  flyway:
    enabled: true

  # ── Native Spring Boot 4.1.x gRPC Client properties (Correctly Nested) ──
  grpc:
    client:
      channel:
        parser-sidecar:
          target: ${PARSER_SIDECAR_GRPC_TARGET:static://localhost:50051}

# Controls detailed execution logs through the standard framework rather than STDOUT
logging:
  level:
    org.hibernate.SQL: DEBUG

# Resilience Gates (Circuit Breaker & Retries)
resilience4j:
  circuitbreaker:
    instances:
      sidecar:
        slidingWindowSize: 10
        failureRateThreshold: 50
      geminiAgent:
        slidingWindowSize: 10
        failureRateThreshold: 50
  retry:
    instances:
      sidecar:
        maxAttempts: 3
        waitDuration: 2s
      geminiAgent:
        maxAttempts: 3
        waitDuration: 2s

# External Object Storage (S3 / MinIO) — aligned with credentials in your .env
storage:
  s3:
    endpoint: ${S3_ENDPOINT:${STORAGE_S3_ENDPOINT:http://localhost:9000}}
    bucket: ${S3_BUCKET:${STORAGE_S3_BUCKET:legacy-artifacts}}
    access-key: ${S3_ACCESS_KEY:${STORAGE_S3_ACCESS_KEY:minioadmin}}
    secret-key: ${S3_SECRET_KEY:${STORAGE_S3_SECRET_KEY:minioadmin}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
  simple:
    metrics:
      export:
        enabled: true

# EPAM DIAL (AI proxy) configuration
external:
  epam:
    dial:
      base-url: ${EPAM_DIAL_BASE_URL:https://ai-proxy.lab.epam.com/openai/deployments/gemini-2.5-pro}
      api-key: ${EPAM_DIAL_API_KEY:}

  # Aligned with "epam" (2 spaces of indentation)
  gemini:
    base-url: ${EXTERNAL_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${EXTERNAL_GEMINI_API_KEY:}

  # Aligned with "epam" (2 spaces of indentation)
  claude:
    base-url: ${EXTERNAL_CLAUDE_BASE_URL:https://api.anthropic.com}
    api-key: ${EXTERNAL_CLAUDE_API_KEY:}

  openai:
    base-url: ${EXTERNAL_OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${EXTERNAL_OPENAI_API_KEY:}

  copilot:
    base-url: ${EXTERNAL_COPILOT_BASE_URL:https://api.githubcopilot.com}
    api-key: ${EXTERNAL_COPILOT_API_KEY:}